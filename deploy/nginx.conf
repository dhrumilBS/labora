# Labora landing page: Nginx server block (static site, no PHP or MySQL needed)
# Tuned for a 4 vCPU / 8 GB Linux server. Copy into /etc/nginx/sites-available/labora,
# set server_name, root and the certificate paths, then: nginx -t && systemctl reload nginx
#
# In /etc/nginx/nginx.conf (http/main context) also make sure you have:
#   worker_processes auto;            # one worker per vCPU (4)
#   events { worker_connections 4096; }
#   sendfile on; tcp_nopush on; tcp_nodelay on;
#   aio threads;                      # large video files are read off the event loop

server {
    listen 80;
    listen [::]:80;
    server_name www.labora.example labora.example;
    return 301 https://www.labora.example$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.labora.example;

    ssl_certificate     /etc/letsencrypt/live/www.labora.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.labora.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/labora;
    index index.html;
    charset utf-8;

    # ---- Compression (text only; images and video are already compressed) ----
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json application/ld+json
               application/manifest+json image/svg+xml text/plain application/xml;
    # If the ngx_brotli module is installed, uncomment for ~15-20% smaller text files:
    # brotli on; brotli_comp_level 5;
    # brotli_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ---- Security headers (repeated in each location that sets add_header) ----
    set $csp "default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests";
    add_header Content-Security-Policy $csp always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HTML: always revalidate so content updates show immediately
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy $csp always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # CSS/JS carry a content hash (?v=...) and fonts never change: cache for a year
    location ~* \.(?:css|js|woff2)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Images: file names are reused when screenshots are replaced, so cache 30 days
    location ~* \.(?:webp|jpg|jpeg|png|svg|ico)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Product tour video: byte-range requests work out of the box for static files,
    # so browsers can start playback and seek without downloading the whole file.
    location ^~ /assets/video/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        sendfile on;
        aio threads;
        directio 4m;          # large files bypass the page cache, small posters still use it
        output_buffers 2 1m;
        access_log off;
    }

    # Master video files are not linked from the page; keep them off the server
    # (or block them here if they get uploaded by accident)
    location ~ ^/labora-product-video[^/]*\.mp4$ { return 404; }

    # Never serve build tooling or docs
    location ~ ^/(?:node_modules|scripts|deploy)/ { return 404; }
    location ~ /(?:package(?:-lock)?\.json|README\.md|\.git.*)$ { return 404; }

    error_page 404 /404.html;
}
